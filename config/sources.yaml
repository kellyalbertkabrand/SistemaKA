# =============================================================================
# SistemaKA — Configuração de fontes
# -----------------------------------------------------------------------------
# Este arquivo controla TUDO que o sistema busca. Você pode editar à vontade:
# adicionar temas, feeds, palavras-chave, sem mexer no código.
# =============================================================================

# Janela (em dias) para considerar uma notícia "recente". Itens mais antigos
# que isso são descartados na coleta diária.
window_days: 2

# Quantos itens, no máximo, entram no relatório de cada dia (após ranquear).
max_items_per_day: 40
# Teto total de itens processados por coleta (limita o trabalho de tradução).
max_total_items: 90

# -----------------------------------------------------------------------------
# PERFIL DO NEGÓCIO (Kelly Albert / KA · Inteligência para Marcas)
# Usado para (a) priorizar matérias relevantes ao negócio e (b) gerar o rodapé
# "como linkar ao seu conteúdo" em cada matéria.
# -----------------------------------------------------------------------------
business:
  nome: "Kelly Albert · KA — Inteligência para Marcas (método Marca com Essência©)"
  descricao: >
    Marca com Essência© é o método de Kelly Albert para construir marcas a partir
    da ESSÊNCIA — posicionamento, proposta de valor, identidade e comunicação.
    Três formatos por nível de maturidade do cliente: Livro (faça você mesmo),
    Mentoria (você faz com orientação) e Programa (nós fazemos por você).
  produtos:
    - nome: "Livro Marca com Essência"
      url: "https://kellyalbert.com.br/livro/"
      preco: "R$ 117"
      nivel: "Despertar — faça você mesmo"
      persona: >
        Empresários, profissionais liberais, especialistas e gestores começando a
        olhar a marca de forma estratégica. Têm marca pessoal ou empresarial e
        querem organizar posicionamento, comunicação e proposta de valor no
        próprio ritmo, com método prático e acessível.
      dor: "Percebo que minha marca precisa de direção e clareza; quero começar a organizar isso sozinho."
    - nome: "Mentoria Marca com Essência"
      url: "https://kellyalbert.com.br/mentoria/"
      preco: "a partir de R$ 990"
      nivel: "Autonomia — você faz com orientação"
      persona: >
        Empresários, profissionais liberais e gestores que já têm marca em
        operação e querem participar ativamente da estratégia, aplicando o método
        com acompanhamento e direcionamento.
      dor: "Quero uma marca mais forte e estratégica, mas preciso de método, clareza e orientação."
    - nome: "Programa Marca com Essência"
      url: "https://kellyalbert.com.br/programa/"
      preco: "a partir de R$ 8.000"
      nivel: "Maturidade — nós fazemos por você"
      persona: >
        Empresas maduras, com história, clientes, operação estruturada e entrega
        validada pelo mercado (não necessariamente grandes). Já passaram da fase
        de sobrevivência e percebem que a marca precisa acompanhar a evolução do
        negócio.
      dor: "Minha empresa cresceu e entrega mais do que o mercado percebe; preciso organizar a marca com profundidade e apoio especializado."
  publico: "Da marca pessoal ao negócio maduro: quem quer posicionar/reposicionar a marca a partir da essência."
  termos_prioritarios:
    - posicionamento
    - positioning
    - reposicionamento
    - repositioning
    - marca pessoal
    - personal brand
    - identidade de marca
    - brand identity
    - branding
    - brand
    - rebranding
    - essência da marca
    - propósito de marca
    - brand purpose
    - proposta de valor
    - storytelling de marca
    - autoridade de marca
    - gestão de marca
    - marketing
    - semiótica
    - semiotics
    - neuromarketing
    - inteligência artificial
    - artificial intelligence
    - marca
    - campanha
    - campaign
    - publicidade
    - advertising
    - pesquisa de mercado
    - market research
    - consumer insights
    - comportamento do consumidor
    - consumer behavior
    - tendências de consumo
    - consumer trends

# -----------------------------------------------------------------------------
# Google News — buscas por idioma/região (trazem o link real do veículo).
# locales = onde/como buscar | topics = o que buscar.
# -----------------------------------------------------------------------------
google_news_locales:
  - { name: "Brasil",  hl: "pt-BR", gl: "BR", ceid: "BR:pt-419", lang: pt, region: BR }
  - { name: "Mundo",   hl: "en-US", gl: "US", ceid: "US:en",     lang: en, region: world }

google_news_topics:
  - category: branding_ia
    label: "Branding & IA"
    query_pt: '(branding OR "posicionamento de marca" OR "identidade de marca" OR rebranding) "inteligência artificial"'
    query_en: '(branding OR "brand positioning" OR "brand identity" OR rebranding) "artificial intelligence"'
  - category: marketing_ia
    label: "Marketing & IA"
    query_pt: '("estratégia de marca" OR branding) marketing "inteligência artificial"'
    query_en: '("brand strategy" OR branding) marketing "artificial intelligence"'
  - category: branding
    label: "Branding"
    query_pt: 'branding "estratégia de marca"'
    query_en: 'branding "brand strategy"'
  - category: campanha
    label: "Campanhas & Ideias"
    query_pt: 'campanha publicitária marca conceito criativo'
    query_en: 'advertising campaign brand creative idea'
  - category: posicionamento
    label: "Posicionamento & Reposicionamento"
    query_pt: 'posicionamento de marca OR reposicionamento de marca'
    query_en: 'brand positioning OR repositioning OR rebranding'
  - category: semiotica
    label: "Semiótica de Marca"
    query_pt: 'semiótica marca branding'
    query_en: 'semiotics branding brand'
  - category: neuromarketing
    label: "Neuromarketing"
    query_pt: 'neuromarketing marca consumidor'
    query_en: 'neuromarketing brand consumer behavior'
  - category: polemica
    label: "Polêmicas de Marca"
    query_pt: 'marca polêmica OR publicidade polêmica OR boicote marca OR "cancelamento de marca" OR rebranding polêmico'
    query_en: '"brand" controversy OR "ad controversy" OR "brand boycott" OR "rebrand backlash"'
  - category: pesquisa
    label: "Pesquisas & Tendências"
    query_pt: 'pesquisa de mercado marca OR "tendências de consumo" OR comportamento do consumidor marca'
    query_en: 'consumer research brand OR "consumer trends" OR "market research" branding'

