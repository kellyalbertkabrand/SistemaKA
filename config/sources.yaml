# -----------------------------------------------------------------------------
# Google News — buscas por idioma/região (trazem o link real do veículo).
# locales = onde/como buscar | topics = o que buscar.
# -----------------------------------------------------------------------------
google_news_locales:
  - { name: "Brasil",  hl: "pt-BR", gl: "BR", ceid: "BR:pt-419", lang: pt, region: BR }
  - { name: "Mundo",   hl: "en-US", gl: "US", ceid: "US:en",     lang: en, region: world }

google_news_topics:
  # NÚCLEO: posicionamento e reposicionamento (a especialidade da KA).
  - category: posicionamento
    label: "Posicionamento & Reposicionamento"
    query_pt: '"posicionamento de marca" OR "reposicionamento de marca" OR rebranding OR "nova identidade de marca" OR "mudança de marca"'
    query_en: '"brand positioning" OR "brand repositioning" OR rebranding OR "brand refresh" OR "new brand identity"'
  # NÚCLEO: essência, propósito e cultura ("de dentro para fora").
  - category: essencia
    label: "Essência, Propósito & Cultura"
    query_pt: '"propósito de marca" OR "essência da marca" OR "cultura de marca" OR "marca de fundador" OR "branding de propósito"'
    query_en: '"brand purpose" OR "brand essence" OR "founder brand" OR "brand culture" OR "purpose-driven brand"'
  - category: branding
    label: "Branding"
    query_pt: 'branding "estratégia de marca" OR "gestão de marca" OR "construção de marca"'
    query_en: 'branding "brand strategy" OR "brand building" OR "brand management"'
  # IA aplicada a MARCA (não IA genérica): estratégia, posicionamento, agentes.
  - category: branding_ia
    label: "Branding & IA"
    query_pt: '("estratégia de marca" OR "posicionamento de marca" OR branding OR rebranding OR "identidade de marca") ("inteligência artificial" OR "agentes de IA" OR "IA generativa")'
    query_en: '("brand strategy" OR "brand positioning" OR branding OR rebranding OR "brand identity") ("artificial intelligence" OR "AI agents" OR "generative AI")'
  - category: marketing_ia
    label: "Marketing & IA"
    query_pt: '"estratégia de marca" marketing ("inteligência artificial" OR "agentes de IA")'
    query_en: '"brand strategy" marketing ("artificial intelligence" OR "AI agents")'
  - category: campanha
    label: "Campanhas & Ideias"
    query_pt: 'campanha publicitária marca conceito criativo'
    query_en: 'advertising campaign brand creative idea'
  # PME e marca pessoal (a tese: branding faz o pequeno crescer).
  - category: pme
    label: "Marca para PME & Marca Pessoal"
    query_pt: '"branding para pequenas empresas" OR "marca pessoal" OR "branding para PME" OR "marca de pequeno negócio" OR "branding para empreendedores"'
    query_en: '"small business branding" OR "personal branding" OR "branding for small business" OR "solopreneur brand" OR "founder-led brand"'
  - category: semiotica
    label: "Semiótica de Marca"
    query_pt: 'semiótica marca branding OR "significado de marca"'
    query_en: 'semiotics branding brand OR "brand meaning"'
  - category: neuromarketing
    label: "Neuromarketing"
    query_pt: 'neuromarketing marca consumidor OR "decisão de compra"'
    query_en: 'neuromarketing brand consumer behavior OR "purchase decision"'
  - category: polemica
    label: "Polêmicas de Marca"
    query_pt: 'marca polêmica OR "publicidade polêmica" OR "boicote" marca OR "cancelamento de marca" OR "crise de marca" OR "rebranding polêmico"'
    query_en: '"brand controversy" OR "ad controversy" OR "brand boycott" OR "rebrand backlash" OR "brand crisis"'
  - category: influencer
    label: "Polêmicas de Influenciadores"
    query_pt: '(influenciador OR influencer OR youtuber OR "criador de conteúdo" OR "Virginia Fonseca" OR "Carlinhos Maia") (polêmica OR cancelamento OR boicote OR "crise de imagem" OR escândalo OR processo OR acusação OR treta OR exposição OR críticas OR repercussão OR denúncia)'
    query_en: '(influencer OR "content creator" OR youtuber OR creator) (controversy OR backlash OR canceled OR cancelled OR boycott OR scandal OR lawsuit OR "PR crisis" OR slammed OR accused)'
  - category: pesquisa
    label: "Pesquisas & Tendências"
    query_pt: 'pesquisa de mercado marca OR "tendências de consumo" OR comportamento do consumidor marca'
    query_en: 'consumer research brand OR "consumer trends" OR "market research" branding'

