# -----------------------------------------------------------------------------
# Fontes acadêmicas (artigos / papers). Crossref cobre periódicos de várias
# editoras; arXiv cobre preprints (mais voltado a IA/computação).
# -----------------------------------------------------------------------------
academic:
  crossref_queries:
    - { query: "brand positioning",                category: posicionamento }
    - { query: "brand repositioning rebranding",   category: posicionamento }
    - { query: "brand purpose authenticity",       category: essencia }
    - { query: "founder brand organizational culture", category: essencia }
    - { query: "small business branding SME",      category: pme }
    - { query: "personal branding entrepreneur",   category: pme }
    - { query: "brand semiotics meaning",          category: semiotica }
    - { query: "neuromarketing brand consumer",    category: neuromarketing }
    - { query: "artificial intelligence branding", category: branding_ia }
    - { query: "consumer behavior brand trends",   category: pesquisa }
    - { query: "market research consumer insights", category: pesquisa }
  crossref_window_days: 30   # papers acadêmicos saem em ritmo mais lento
  # arXiv desativado: é repositório de computação/física e trazia papers de IA
  # sem relação com branding (ruído). O acadêmico relevante vem do Crossref.
  arxiv_queries: []

