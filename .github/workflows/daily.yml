name: Coleta diária (SistemaKA)

# O que este robô faz: todo dia coleta as notícias e SALVA no repositório.
# Quem publica o site é o Netlify (conectado ao repositório), que reconstrói
# o painel automaticamente sempre que esta coleta salva novidades.
#
# Quando roda:
#  - schedule: todo dia (07:30 e 13:30 no horário de Brasília)
#  - workflow_dispatch: quando você clica em "Atualizar agora" / "Run workflow"
on:
  schedule:
    - cron: "30 10 * * *"   # 10:30 UTC = 07:30 Brasília
    - cron: "30 16 * * *"   # 16:30 UTC = 13:30 Brasília
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sistemaka-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar notícias do dia
        env:
          # Opcional: defina o segredo ANTHROPIC_API_KEY para resumos com IA.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SISTEMAKA_REPO: ${{ github.repository }}
        run: python -m sistemaka run

      - name: Salvar histórico (dispara a republicação no Netlify)
        run: |
          git config user.name "SistemaKA Bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sem novidades no histórico."
          else
            git commit -m "chore: histórico de coleta ($(date -u +%Y-%m-%d))"
            git push
          fi
