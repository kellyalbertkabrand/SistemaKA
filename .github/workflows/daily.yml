name: Coleta diária (SistemaKA)

# Todo dia: coleta as notícias, salva no repositório e (se houver credencial)
# republica o painel no Netlify automaticamente.
#
# Quando roda:
#  - schedule: todo dia (07:30 e 13:30 no horário de Brasília)
#  - workflow_dispatch: quando você clica em "Atualizar agora" / "Run workflow"
on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 07:00 Brasília
    - cron: "0 19 * * *"   # 19:00 UTC = 16:00 Brasília
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sistemaka-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar notícias do dia + gerar painel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SISTEMAKA_REPO: ${{ github.repository }}
        run: python -m sistemaka run

      - name: Salvar histórico no repositório
        run: |
          git config user.name "SistemaKA Bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sem novidades no histórico."
          else
            git commit -m "chore: histórico de coleta ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Republicar no Netlify (se a credencial estiver configurada)
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        run: |
          npx -y netlify-cli@17 deploy \
            --dir=public \
            --site=08fc9134-351a-4237-9891-fd4dea56d013 \
            --prod \
            --message "Coleta de $(date -u +%Y-%m-%d)"
