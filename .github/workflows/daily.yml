name: Coleta diária (SistemaKA)

# Todo dia: coleta as notícias, salva no repositório e (se houver credencial)
# republica o painel no Netlify automaticamente.
#
# Quando roda:
#  - schedule: VÁRIAS vezes ao dia. O agendador do GitHub costuma ATRASAR a
#    execução (até 2–4h), então rodamos várias vezes e em minutos "quebrados"
#    (atrasam menos) para garantir que, quando você abrir o painel, o dia já
#    esteja coletado e publicado.
#  - workflow_dispatch: quando você clica em "Atualizar agora" / "Run workflow"
on:
  schedule:
    - cron: "37 7 * * *"    # 07:37 UTC ≈ 04:37 Brasília (bem cedo)
    - cron: "37 10 * * *"   # 10:37 UTC ≈ 07:37 Brasília
    - cron: "37 13 * * *"   # 13:37 UTC ≈ 10:37 Brasília
    - cron: "37 16 * * *"   # 16:37 UTC ≈ 13:37 Brasília
    - cron: "37 19 * * *"   # 19:37 UTC ≈ 16:37 Brasília
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sistemaka-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar notícias do dia + gerar painel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SISTEMAKA_REPO: ${{ github.repository }}
        run: python -m sistemaka run

      - name: Salvar histórico no repositório
        continue-on-error: true
        run: |
          git config user.name "SistemaKA Bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sem novidades no histórico."
          else
            git commit -m "chore: histórico de coleta ($(date -u +%Y-%m-%d))"
            # Empurra com segurança: puxa antes (rebase) e tenta de novo se colidir.
            for i in 1 2 3 4 5; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Histórico enviado."; break
              fi
              echo "Push colidiu (tentativa $i) — puxando e tentando de novo..."
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
              sleep 5
            done
          fi

      - name: Republicar no Netlify (se a credencial estiver configurada)
        if: ${{ always() && env.NETLIFY_AUTH_TOKEN != '' }}
        run: |
          npx -y netlify-cli@17 deploy \
            --dir=public \
            --functions=netlify/functions \
            --site=08fc9134-351a-4237-9891-fd4dea56d013 \
            --prod \
            --message "Coleta de $(date -u +%Y-%m-%d)"
