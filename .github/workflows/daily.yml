name: Coleta diária (SistemaKA)

# Todo dia, de madrugada: coleta as notícias, escreve o post pronto do dia
# (legenda + imagem), publica cada matéria no app da Kelly (Firestore) e salva
# o histórico no repositório.
#
# Quando roda:
#  - schedule: 1x por dia, às 3h de Brasília. O agendador do GitHub pode
#    atrasar um pouco a execução (minutos a pouco mais de 1h em dias
#    concorridos) — normal, o conteúdo do dia estará pronto de manhã.
#  - workflow_dispatch: quando você clica em "Atualizar agora" / "Run workflow"
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 03:00 Brasília (sem horário de verão)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sistemaka-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar notícias do dia + gerar painel + post pronto
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SISTEMAKA_REPO: ${{ github.repository }}
        run: python -m sistemaka run

      - name: Salvar histórico no repositório
        continue-on-error: true
        run: |
          git config user.name "SistemaKA Bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sem novidades no histórico."
          else
            git commit -m "chore: histórico de coleta ($(date -u +%Y-%m-%d))"
            # Empurra com segurança: puxa antes (rebase) e tenta de novo se colidir.
            for i in 1 2 3 4 5; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Histórico enviado."; break
              fi
              echo "Push colidiu (tentativa $i) — puxando e tentando de novo..."
              git fetch origin "${GITHUB_REF_NAME}" || true; git merge -X ours --no-edit "origin/${GITHUB_REF_NAME}" || git merge --abort
              sleep 5
            done
          fi

      - name: Republicar no Netlify (se a credencial estiver configurada)
        if: ${{ always() && env.NETLIFY_AUTH_TOKEN != '' }}
        run: |
          npx -y netlify-cli@17 deploy \
            --dir=public \
            --functions=netlify/functions \
            --site=08fc9134-351a-4237-9891-fd4dea56d013 \
            --prod \
            --message "Coleta de $(date -u +%Y-%m-%d)"
