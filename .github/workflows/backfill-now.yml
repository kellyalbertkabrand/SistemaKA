name: Backfill + deploy (one-time)

# Recoleta os últimos dias usando o mapa ampliado de portais (BR/EUA/Europa),
# mescla por data de publicação e republica. Dispara quando este arquivo muda.
on:
  push:
    paths:
      - '.github/workflows/backfill-now.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar últimos 4 dias com os novos portais
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SISTEMAKA_REPO: ${{ github.repository }}
        run: python -m sistemaka run --days 4

      - name: Salvar histórico no repositório
        run: |
          git config user.name "SistemaKA Bot"
          git config user.email "actions@github.com"
          git add data
          git commit -m "data: coleta com mapa ampliado de portais (BR/EUA/Europa)" || echo "sem mudanças"
          git push || echo "nada a enviar"

      - name: Publicar no Netlify
        run: |
