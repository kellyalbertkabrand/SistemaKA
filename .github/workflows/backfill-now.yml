name: Backfill + deploy (one-time)

# Recoleta os últimos dias (mescla com o que já existe, sem apagar), salva o
# histórico e republica o painel. Dispara sozinho quando este arquivo muda.
on:
  push:
    paths:
      - '.github/workflows/backfill-now.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Recoletar últimos 8 dias (mescla por data de publicação)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SISTEMAKA_REPO: ${{ github.repository }}
        run: python -m sistemaka run --days 8

      - name: Salvar histórico no repositório
        run: |
          git config user.name "SistemaKA Bot"
          git config user.email "actions@github.com"
          git add data
          git commit -m "data: backfill 8 dias (01-06/06)" || echo "sem mudanças"
          git push || echo "nada a enviar"

      - name: Publicar no Netlify
        run: |
          npx -y @netlify/mcp@latest \
