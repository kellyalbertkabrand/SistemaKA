name: Backfill + deploy (one-time)

# Recoleta os últimos dias e publica usando a CHAVE FIXA (NETLIFY_AUTH_TOKEN).
# Dispara quando este arquivo muda.
on:
  push:
    paths:
      - '.github/workflows/backfill-now.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar últimos dias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SISTEMAKA_REPO: ${{ github.repository }}
        run: python -m sistemaka run --days 3

      - name: Salvar histórico no repositório
        run: |
          git config user.name "SistemaKA Bot"
          git config user.email "actions@github.com"
          git add data
          git commit -m "data: coleta com mapa ampliado de portais (BR/EUA/Europa)" || echo "sem mudanças"
          git push || echo "nada a enviar"

      - name: Publicar no Netlify (precisa do segredo NETLIFY_AUTH_TOKEN)
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::Coleta salva, mas falta NETLIFY_AUTH_TOKEN para publicar."
            exit 0
          fi
          npx -y netlify-cli@17 deploy \
            --dir=public \
            --site=08fc9134-351a-4237-9891-fd4dea56d013 \
            --prod \
            --message "Coleta ($(date -u +%Y-%m-%d))"
