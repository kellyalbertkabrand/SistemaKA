# verify: 1-clique Atualizar agora (funcao netlify) v1
name: Publicar agora (one-time)

# Publica usando a CHAVE FIXA do Netlify (segredo NETLIFY_AUTH_TOKEN).
on:
  push:
    paths:
      - '.github/workflows/publish-now.yml'

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar o painel
        env:
          SISTEMAKA_REPO: ${{ github.repository }}
        run: python -m sistemaka build

      - name: Publicar no Netlify (chave fixa)
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN NAO encontrado — o segredo nao esta configurado (ou o nome esta diferente)."
            exit 1
          fi
          echo "Token presente. Publicando..."
          npx -y netlify-cli@17 deploy \
            --dir=public \
            --functions=netlify/functions \
            --site=08fc9134-351a-4237-9891-fd4dea56d013 \
            --prod \
            --message "Publicacao (chave fixa) $(date -u +%Y-%m-%dT%H:%M)"
