name: Publicar app no Netlify

# Publica o "Sistema Visual de Publicações da Marca" (estudio-marca-ka/) no
# Netlify usando o segredo NETLIFY_AUTH_TOKEN do repositório — o mesmo usado
# pelo deploy do sistema de notícias. Dispara:
#   - manualmente (aba Actions → Run workflow), ou
#   - quando este arquivo muda na branch estudiodemarca.
on:
  workflow_dispatch:
  push:
    branches: [estudiodemarca]
    paths:
      - '.github/workflows/publicar-app.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      # Chaves PÚBLICAS do Supabase (as mesmas configuradas no Netlify;
      # a anon/publishable key é feita para ir no navegador).
      VITE_SUPABASE_URL: https://swxbtuzgypksoarbvjge.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_oKTH9_LIQngDn4inhnLwKQ_sFEbeIMI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: estudio-marca-ka/package-lock.json

      - name: Instalar e buildar
        working-directory: estudio-marca-ka
        run: |
          npm ci
          npm run build

      - name: Diagnóstico — sites visíveis para o token
        run: |
          curl -sS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites?per_page=50" \
            | python3 -c "import json,sys; [print(s['id'], '|', s['name'], '|', s.get('account_slug','')) for s in json.load(sys.stdin)]" \
            || echo "(falha ao listar sites)"

      - name: Publicar no Netlify
        working-directory: estudio-marca-ka
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Falta o segredo NETLIFY_AUTH_TOKEN em Settings → Secrets → Actions."
            exit 1
          fi
          npx -y netlify-cli@17 deploy \
            --dir=dist \
            --site=620d408e-bb8a-49fb-a1da-ccf602320142 \
            --prod \
            --message "Deploy via GitHub Actions ($GITHUB_REF_NAME @ ${GITHUB_SHA::7})"
