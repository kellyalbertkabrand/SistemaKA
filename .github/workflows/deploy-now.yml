name: Deploy agora (one-time)

# Workflow de bootstrap: publica o painel no Netlify a partir do runner do
# GitHub (que tem internet liberada). Dispara sozinho quando este arquivo muda.
on:
  push:
    paths:
      - '.github/workflows/deploy-now.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

