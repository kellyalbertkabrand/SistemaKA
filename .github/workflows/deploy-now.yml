name: Deploy agora (one-time)

# Republica o painel no Netlify a partir dos dados já existentes no repositório
# (não recoleta). Dispara sozinho quando este arquivo muda.
on:
  push:
    paths:
      - '.github/workflows/deploy-now.yml'

permissions:
  contents: read

