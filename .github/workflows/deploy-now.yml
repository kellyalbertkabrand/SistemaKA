name: Deploy agora (one-time)

# Publica o painel no Netlify usando a CHAVE FIXA (segredo NETLIFY_AUTH_TOKEN),
# sem depender de conector externo. Dispara quando este arquivo muda.
on:
  push:
    paths:
      - '.github/workflows/deploy-now.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar o painel (a partir do histórico já coletado)
        env:
          SISTEMAKA_REPO: ${{ github.repository }}
        run: python -m sistemaka build

      - name: Publicar no Netlify (precisa do segredo NETLIFY_AUTH_TOKEN)
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::Falta o segredo NETLIFY_AUTH_TOKEN. Adicione em Settings → Secrets → Actions para publicar."
            exit 0
          fi
          npx -y netlify-cli@17 deploy \
            --dir=public \
            --site=08fc9134-351a-4237-9891-fd4dea56d013 \
            --prod \
            --message "Publicacao manual ($(date -u +%Y-%m-%dT%H:%M))"
