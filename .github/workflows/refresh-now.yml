# trigger: rede ampliada de polêmica de influenciador v6
name: Coleta + Refresh do histórico (one-time)

# Dispara quando este arquivo muda. Faz, em sequência:
#  1) coleta nova (já com os temas novos: Essência, PME, etc.)
#  2) re-processa TODO o histórico com o perfil novo dos 4 produtos
#  3) salva o histórico e republica o painel no Netlify (chave fixa)
on:
  push:
    paths:
      - '.github/workflows/refresh-now.yml'

permissions:
  contents: write

concurrency:
  group: sistemaka-coleta
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coleta nova (temas novos) + refresh de todo o histórico
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SISTEMAKA_REPO: ${{ github.repository }}
        run: |
          python -m sistemaka run
          python -m sistemaka refresh

      - name: Salvar histórico no repositório
        continue-on-error: true
        run: |
          git config user.name "SistemaKA Bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sem mudanças no histórico."
          else
            git commit -m "data: coleta nova + refresh do histórico (perfil/temas atualizados)"
            for i in 1 2 3 4 5; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Histórico enviado."; break
              fi
              echo "Push colidiu (tentativa $i) — puxando e tentando de novo..."
              git fetch origin "${GITHUB_REF_NAME}" || true; git merge -X ours --no-edit "origin/${GITHUB_REF_NAME}" || git merge --abort
              sleep 5
            done
          fi

      - name: Republicar no Netlify (chave fixa)
        if: ${{ always() && env.NETLIFY_AUTH_TOKEN != '' }}
        run: |
          npx -y netlify-cli@17 deploy \
            --dir=public \
            --functions=netlify/functions \
            --site=08fc9134-351a-4237-9891-fd4dea56d013 \
            --prod \
            --message "Refresh do radar $(date -u +%Y-%m-%dT%H:%M)"
