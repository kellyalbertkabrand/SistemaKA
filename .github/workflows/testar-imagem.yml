# trigger: gerar 1 imagem de teste (OpenAI) e publicar como artefato v1
name: Testar imagem (one-time)

# Gera UMA imagem de teste com a chave da OpenAI e sobe como artefato do run,
# pra confirmar rápido que a geração de imagem está funcionando — sem esperar
# a coleta inteira. Dispara quando este arquivo muda.
on:
  push:
    paths:
      - '.github/workflows/testar-imagem.yml'

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar imagem de teste
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "
          from sistemaka import content
          prompt = ('Minimalist editorial illustration about brand positioning '
                     'and identity, abstract, muted professional colors, no '
                     'text, no real logos or faces.')
          img = content._generate_image(prompt)
          if not img:
              raise SystemExit('FALHOU: nenhuma imagem retornada (ver logs/OPENAI_API_KEY)')
          with open('teste_imagem.png', 'wb') as f:
              f.write(img)
          print(f'OK: imagem gerada, {len(img)} bytes')
          "

      - name: Publicar imagem como artefato
        uses: actions/upload-artifact@v4
        with:
          name: teste-imagem
          path: teste_imagem.png
          retention-days: 3
