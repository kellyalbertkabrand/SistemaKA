<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#152535" />

    <!-- SEO / indexação (tudo aponta para kellyalbert.com.br como marca oficial) -->
    <title>Sistema Visual de Publicações da Marca · KA — Kelly Albert</title>
    <meta
      name="description"
      content="Sistema Visual de Publicações da Marca, de Kelly Albert (KA): geração de peças para redes sociais na identidade visual de cada cliente. Design de marca autoral por Kelly Albert."
    />
    <meta name="author" content="Kelly Albert" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://estudiodemarca.kellyalbert.com.br/" />

    <!-- Open Graph (prévia ao compartilhar o link) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sistema Visual de Publicações da Marca" />
    <meta property="og:title" content="Sistema Visual de Publicações da Marca · KA" />
    <meta
      property="og:description"
      content="Peças para redes sociais na identidade visual de cada cliente. Design de marca autoral por Kelly Albert."
    />
    <meta property="og:url" content="https://estudiodemarca.kellyalbert.com.br/" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sistema Visual de Publicações da Marca · KA" />
    <meta
      name="twitter:description"
      content="Peças para redes sociais na identidade visual de cada cliente, por Kelly Albert."
    />

    <!-- Dados estruturados: entidade da marca é kellyalbert.com.br -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Sistema Visual de Publicações da Marca",
        "alternateName": "Estúdio de Marca — KA",
        "description": "Design de marca autoral e geração de peças para redes sociais na identidade visual de cada cliente.",
        "url": "https://kellyalbert.com.br",
        "areaServed": "BR",
        "founder": { "@type": "Person", "name": "Kelly Albert" },
        "brand": { "@type": "Brand", "name": "Sistema Visual de Publicações da Marca" },
        "sameAs": ["https://estudiodemarca.kellyalbert.com.br"]
      }
    </script>

    <!-- Ícone do app: é o que aparece quando a KA salva o link na tela de
         início do celular (iPhone usa o apple-touch-icon; Android, o manifest).
         Monograma KA em preto sobre o creme da marca (#E7E0CD) — gerado a
         partir de public/clientes/ka/ka-preto.png. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icones/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icones/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icones/icone-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Nome curto embaixo do ícone na tela de início do iPhone -->
    <meta name="apple-mobile-web-app-title" content="Estúdio KA" />
    <meta name="application-name" content="Estúdio KA" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
